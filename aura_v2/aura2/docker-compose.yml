services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    ports:
      - "5433:5432"
    volumes:
      - aura_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: [.env]
    environment:
      POSTGRES_URI: postgresql://aura:aura@postgres:5432/aura
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets
      - aura_storage:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: rq worker ingestion --url redis://redis:6379/0
    env_file: [.env]
    environment:
      POSTGRES_URI: postgresql://aura:aura@postgres:5432/aura
      REDIS_URL: redis://redis:6379/0
    volumes:
      - aura_storage:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  ui:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      AURA_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  aura_postgres_data:
  aura_storage:
